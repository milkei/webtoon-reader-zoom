<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>웹툰 본문 크기</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #202522;
      --muted: #69746e;
      --line: #dfe5e0;
      --panel: #f4f7f5;
      --accent: #168f4b;
      --selected: #eaf7ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181c19;
        --text: #eaf0eb;
        --muted: #b2bbb4;
        --line: #384239;
        --panel: #252d27;
        --accent: #6edb92;
        --selected: #203e2b;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { width: 300px; padding: 18px; margin: 0; color: var(--text); background: var(--bg); }
    h1 { font-size: 17px; margin: 0 0 5px; line-height: 1.4; }
    .description { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0 0 18px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
    #value { color: var(--accent); font-size: 15px; font-variant-numeric: tabular-nums; }
    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .preset {
      min-height: 42px; border: 1px solid var(--line); border-radius: 9px;
      font-family: inherit; font-size: 13px; font-weight: 700;
      color: var(--text); background: var(--bg); cursor: pointer;
      transition: background-color 100ms, border-color 100ms;
    }
    .preset:hover { background: var(--panel); }
    .preset[aria-pressed="true"] {
      color: var(--accent); border: 2px solid var(--accent); background: var(--selected);
    }
    .preset:focus-visible, #size:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fine-label { margin: 17px 0 0; color: var(--muted); font-size: 11px; }
    #size { display: block; width: 100%; accent-color: var(--accent); margin: 10px 0 7px; cursor: pointer; }
    .steps { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    #status { margin-top: 16px; padding: 10px 11px; border-radius: 8px; background: var(--panel); color: var(--muted); font-size: 12px; line-height: 1.5; min-height: 38px; }
  </style>
</head>
<body>
  <h1>웹툰 본문만 축소</h1>
  <p class="description">댓글과 메뉴는 100% 크기로 유지해.</p>
  <div class="section-heading"><span id="size-label">본문 이미지 크기</span><strong id="value">50%</strong></div>
  <div class="presets" role="group" aria-label="자주 쓰는 크기 바로 선택">
    <button class="preset" type="button" data-percent="25" aria-pressed="false">25%</button>
    <button class="preset" type="button" data-percent="50" aria-pressed="true">50%</button>
    <button class="preset" type="button" data-percent="75" aria-pressed="false">75%</button>
    <button class="preset" type="button" data-percent="100" aria-pressed="false">100%</button>
  </div>
  <div class="fine-label">세부 조절 (5% 단위)</div>
  <input id="size" type="range" min="0" max="100" step="1" value="50" aria-labelledby="size-label" aria-valuemin="25" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50%">
  <div class="steps"><span>25%</span><span>50% 기본</span><span>100%</span></div>
  <div id="status" role="status" aria-live="polite">페이지 확인 중…</div>
  <script src="popup.js"></script>
</body>
</html>
